<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCSO Lotto Result Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --row-border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #fff;
    }

    .page { max-width: 640px; margin: 0 auto; }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
    }

    /* ---------- Form ---------- */
    form { display: grid; gap: 28px; }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr 1fr;
      column-gap: 16px;
      align-items: end;
    }

    .row > label.row-label,
    .row > .row-label {
      font-size: 15px;
      font-weight: 600;
      padding-bottom: 12px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > span { font-size: 15px; font-weight: 500; }

    /* Row 2: game select + combinations on one line */
    .row.games {
      grid-template-columns: 130px 1fr auto 1fr;
      align-items: center;
    }
    .row.games .row-label { padding-bottom: 0; }
    .inline-label { font-size: 15px; font-weight: 600; }

    input, select {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    input::placeholder { color: var(--text); opacity: 1; }

    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--blue-500);
      outline-offset: 2px;
    }

    input:disabled{
      background: #f3f4f6;
      color: var(--muted);
      cursor: not-allowed;
    }
    input:disabled::placeholder { color: var(--muted)}

    .actions { padding-left: 146px; }

    button[type="submit"] {
      padding: 8px 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--blue-500);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--blue-600); }

    /* ---------- Results table ---------- */
    .table-wrap {
      margin-top: 40px;
      overflow-x: auto;
      border: 1px solid var(--row-border);
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    }

    table { width: 100%; border-collapse: collapse; min-width: 540px; }

    thead th {
      padding: 14px 8px;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--blue-600);
    }
    thead th:first-child { padding-left: 14px; }

    tbody td {
      padding: 14px 8px;
      vertical-align: middle;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--muted);
      border-top: 1px solid var(--row-border);
    }
    tbody td:first-child { padding-left: 14px; }
    tbody td.combo { max-width: 120px; }
    td.combo strong { color: var(--blue-600); font-weight: 700; }

    .empty { text-align: center; padding: 24px; color: var(--muted); }

    @media (max-width: 560px) {
      .row,
      .row.games { grid-template-columns: 1fr 1fr; row-gap: 10px; }
      .row > .row-label { grid-column: 1 / -1; padding-bottom: 0; }
      .row.games .row-label { grid-column: 1 / -1; }
      .row.games .inline-label { grid-column: 1 / -1; margin-top: 8px; }
      .actions { padding-left: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>PCSO Lotto Result<br>Finder</h1>

    <form id="finder" novalidate>
      <div class="row">
        <span class="row-label">Set Draw Date</span>
        <label class="field">
          <span>From :</span>
          <input type="date" id="from" name="from" aria-label="From date">
        </label>
        <label class="field">
          <span>To :</span>
          <input type="date" id="to" name="to" aria-label="To date">
        </label>
      </div>

      <div class="row games">
        <label class="row-label" for="game">Select Lotto Game</label>
        <select id="game" name="game">
          <option value="">All Games</option>
          {% for g in games %}<option>{{ g }}</option>{% endfor %}
        </select>
        <label class="inline-label" for="digits">Combinations</label>
        <input type="text" id="digits" name="digits" placeholder="Enter digits" inputmode="numeric" autocomplete="off">
      </div>

      <div class="actions">
        <button type="submit">Search Lotto</button>
      </div>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Lotto Game</th>
            <th>Combinations</th>
            <th>Draw Date</th>
            <th>Jackpot (PHP)</th>
            <th>Winners</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </main>

  <script>
    const pad = n => String(n).padStart(2, "0");
    const fmtDate = iso => new Date(iso + "T00:00:00")
      .toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" });
    const fmtMoney = n => n >= 1e6
     ? "PHP " + (n / 1e6).toFixed(1) + "M"
     : "PHP " + n.toLocaleString("en-US", { minimumFractionDigits: 2 });
    const body = document.getElementById("results");

    function message(text) {
      body.innerHTML = `<tr><td class="empty" colspan="5">${text}</td></tr>`;
    }

    function render(rows) {
      if (!rows.length) {
        return message("No draws match your search. Try a wider date range or fewer digits.");
      }
      body.innerHTML = rows.map(r => `
        <tr>
          <td>${r.game}${r.draw ? " " + r.draw : ""}</td>
          <td class="combo">${r.numbers.map(n =>
            r.matched.includes(n) ? `<strong>${pad(n)}</strong>` : pad(n)).join(", ")}</td>
          <td>${fmtDate(r.date)}</td>
          <td>${fmtMoney(r.jackpot)}</td>
          <td>${r.winners}</td>
        </tr>`).join("");
    }

    async function search() {
      const params = new URLSearchParams({
        from: document.getElementById("from").value,
        to: document.getElementById("to").value,
        game: document.getElementById("game").value,
        digits: document.getElementById("digits").value
      });
      message("Searching...");
      try {
        const res = await fetch("/api/results?" + params);
        const data = await res.json();
        if (!res.ok) return message(data.error || "Something went wrong.");
        render(data.results);
      } catch (err) {
        console.error(err);
        message("Display error: " + err.message);
      }
    }

    document.getElementById("finder").addEventListener("submit", e => {
      e.preventDefault();
      search();
    });

    const gameSelect = document.getElementById("game");
    const digitsInput = document.getElementById("digits");

    function toggleDigits() {
      const allGames = gameSelect.value === "";
      digitsInput.disabled = allGames;
      if (allGames) digitsInput.value = "";   // clear leftover digits so they aren't sent
      digitsInput.placeholder = allGames ? "Select a game first" : "Enter digits";
    }

    gameSelect.addEventListener("change", toggleDigits);
    toggleDigits();

    search();
  </script>
</body>
</html>
